<style>
:root{
  --bg:#0b0b0f;
  --bg-2:#141419;
  --bg-3:#1d1d24;
  --line:rgba(255,255,255,.08);
  --fg:#f4f4f6;
  --fg-2:#a9a9b4;
  --fg-3:#6f6f7b;
  --ac:#ffffff;
  --gut:max(16px, env(safe-area-inset-left));
  --gut-r:max(16px, env(safe-area-inset-right));
  --ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --tile-r:8px;
}
@media (min-width:768px){:root{--gut:max(32px, env(safe-area-inset-left));--gut-r:max(32px, env(safe-area-inset-right))}}
@media (min-width:1200px){:root{--gut:max(56px, env(safe-area-inset-left));--gut-r:max(56px, env(safe-area-inset-right))}}
.g-ff{--ac:#ffc23a}
.g-jc{--ac:#ff8fb6}
.g-pf{--ac:#8fb8ff}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--ui);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:absolute;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;padding:max(14px,env(safe-area-inset-top)) var(--gut-r) 14px var(--gut);background:linear-gradient(180deg,rgba(11,11,15,.7),rgba(11,11,15,0))}
.brand{display:inline-flex;align-items:center;min-height:44px;font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none}
@media (min-width:768px){.brand{font-size:22px}}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--bg);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hero-stage{position:relative;display:grid;height:min(150vw,82svh);min-height:520px}
@media (min-width:700px){.hero-stage{height:clamp(520px,max(56.25vw,60svh),86svh)}}
.slide{grid-area:1/1;position:relative;overflow:hidden;opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 0s linear 1.1s}
.slide.on{opacity:1;visibility:visible;transition:opacity 1.1s ease,visibility 0s}
.slide .bgimg{position:absolute;inset:0}
.slide .bgimg img{width:100%;height:100%;object-fit:cover;object-position:var(--fp,50% 50%)}
.slide .bgimg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(0deg,var(--bg) 0%,rgba(11,11,15,.88) 22%,rgba(11,11,15,.25) 52%,rgba(11,11,15,0) 70%),
  linear-gradient(180deg,rgba(11,11,15,.55) 0%,rgba(11,11,15,0) 18%)}
@media (min-width:700px){
  .slide .bgimg::after{background:
    linear-gradient(0deg,var(--bg) 0%,rgba(11,11,15,.6) 16%,rgba(11,11,15,0) 42%),
    linear-gradient(90deg,rgba(11,11,15,.92) 0%,rgba(11,11,15,.7) 26%,rgba(11,11,15,.15) 52%,rgba(11,11,15,0) 66%),
    linear-gradient(180deg,rgba(11,11,15,.5) 0%,rgba(11,11,15,0) 16%)}
}
.slide .copy{position:absolute;left:var(--gut);right:var(--gut-r);bottom:64px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
@media (min-width:700px){.slide .copy{align-items:flex-start;text-align:left;right:auto;max-width:min(560px,46vw);bottom:clamp(64px,13vh,150px);gap:18px}}
.pitch{margin:0;font-size:15px;line-height:1.45;color:#e2e2e8;max-width:42ch;text-shadow:0 1px 12px rgba(0,0,0,.6)}
@media (min-width:700px){.pitch{font-size:clamp(16px,1.35vw,20px)}}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:inherit}
.slide .actions{justify-content:center}
@media (min-width:700px){.slide .actions{justify-content:flex-start}}
.slide .ph::before{display:none}
.progress{position:absolute;right:var(--gut-r);bottom:18px;display:flex;gap:6px;z-index:3}
@media (max-width:699px){.progress{left:0;right:0;justify-content:center;bottom:14px}}
.progress button{width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:6px}
.progress span{display:block;width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
.progress [aria-current="true"] span::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(var(--p,1))}
.progress button:hover span{background:rgba(255,255,255,.45)}

/* ---------- trailers ---------- */
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--fp,50% 50%);opacity:0;transition:opacity 1s ease;background:transparent;pointer-events:none}
.vid.playing{opacity:1}
.tile .vid{transition-duration:.45s}
.mute{position:absolute;z-index:6;right:var(--gut-r);bottom:18px;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:rgba(11,11,15,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;display:none;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,transform .08s}
.mute svg{width:20px;height:20px}
.mute:hover{background:rgba(255,255,255,.16);border-color:#fff}
.mute:active{transform:scale(.94)}
.mute:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac)}
.has-video > .mute{display:grid}
@media (max-width:699px){.hero .mute{bottom:14px}}
@media (min-width:700px){.progress{right:calc(var(--gut-r) + 56px)}}
.vbadge{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.vbadge span{width:64px;height:64px;border-radius:50%;background:rgba(11,11,15,.55);border:1.5px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;transition:background .15s,color .15s,transform .2s var(--ease)}
.vbadge svg{width:26px;height:26px;margin-left:3px}
.viewer-main:hover .vbadge span,.viewer-main:focus-visible .vbadge span{background:#fff;color:#000;transform:scale(1.06)}
.thumb .vbadge span{width:28px;height:28px;border-width:1px}
.thumb .vbadge svg{width:12px;height:12px;margin-left:2px}
#lbVid{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:6px;background:#000}
#lbVid[hidden],#lbImg[hidden]{display:none}

/* ---------- game titles: each game keeps its own face ---------- */
.logo{margin:0;font-weight:400;line-height:.95;letter-spacing:0;max-width:100%}
.logo-ff{font-family:"Lilita One",var(--ui);color:#ffc23a;-webkit-text-stroke:.09em #3a1206;paint-order:stroke fill;text-shadow:0 .06em 0 #3a1206}
.logo-ff span{color:#fff3d6}
.logo-jc{font-family:"Dela Gothic One",var(--ui);color:#fff;letter-spacing:-.01em;text-shadow:.045em .045em 0 #7d4ed8}
.logo-jc span{color:#ff8fb6}
.logo-pf{font-family:"Gochi Hand",var(--ui);color:#fff;line-height:.9;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero .logo{font-size:clamp(46px,13vw,64px)}
@media (min-width:700px){.hero .logo{font-size:clamp(56px,6.4vw,104px)}}
.hero .logo-pf{font-size:clamp(54px,15vw,74px)}
@media (min-width:700px){.hero .logo-pf{font-size:clamp(64px,7.4vw,120px)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:6px;border:0;font:700 16px/1 var(--ui);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,box-shadow .2s,transform .08s;-webkit-tap-highlight-color:transparent}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-play{background:#fff;color:#000}
.btn-play:hover{background:#e6e6ea;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 35%,transparent),0 0 28px color-mix(in srgb,var(--ac) 45%,transparent)}
.btn-soft{background:rgba(120,120,135,.42);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn-soft:hover{background:rgba(140,140,155,.55)}
.btn-line{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.btn-line:hover{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac),0 0 22px color-mix(in srgb,var(--ac) 55%,transparent)}
@media (min-width:700px){.btn{min-height:52px;font-size:17px;padding:0 28px}}

/* ---------- rows ---------- */
main{position:relative}
.row{position:relative;z-index:2}
.slide .ph,.d-hero .ph{height:100%}
.row{margin-top:12px;padding-bottom:8px}
.row + .row{margin-top:28px}
@media (min-width:700px){.row{margin-top:-24px}.row + .row{margin-top:40px}}
.row h2{margin:0 0 10px;padding:0 var(--gut-r) 0 var(--gut);font-size:18px;font-weight:700;letter-spacing:-.01em}
@media (min-width:700px){.row h2{font-size:21px;margin-bottom:14px}}
.track-wrap{position:relative}
.track{display:flex;gap:10px;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;scroll-padding-left:var(--gut);padding:18px var(--gut-r) 26px var(--gut);margin:-18px 0 -26px;list-style:none;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
@media (min-width:700px){.track{gap:14px}}
.track > li{flex:0 0 auto;scroll-snap-align:start}
@media (hover:hover) and (min-width:700px){
  .track-wrap.can-l::before,.track-wrap.can-r::after{content:"";position:absolute;top:0;bottom:0;width:var(--gut);z-index:3;pointer-events:none}
  .track-wrap.can-l::before{left:0;background:linear-gradient(90deg,var(--bg),rgba(11,11,15,0))}
  .track-wrap.can-r::after{right:0;background:linear-gradient(270deg,var(--bg),rgba(11,11,15,0))}
}
.row-arrow{display:none}
@media (hover:hover) and (pointer:fine){
  .row-arrow{display:grid;place-items:center;position:absolute;top:0;bottom:0;z-index:4;width:var(--gut);min-width:44px;border:0;background:rgba(11,11,15,.55);color:#fff;cursor:pointer;opacity:0;transition:opacity .2s}
  .row-arrow svg{width:28px;height:28px;transition:transform .15s}
  .row-arrow:hover svg{transform:scale(1.25)}
  .row-arrow.l{left:0}.row-arrow.r{right:0}
  .track-wrap:hover .row-arrow:not([hidden]){opacity:1}
  .row-arrow[hidden]{display:none}
}

/* game tile */
.tile{position:relative;width:min(84vw,420px);border-radius:var(--tile-r);transition:transform .3s var(--ease),box-shadow .3s var(--ease);background:var(--bg-2)}
@media (min-width:700px){.tile{width:calc((100vw - var(--gut) - var(--gut-r) - 14px) / 2.15)}}
@media (min-width:1080px){.tile{width:calc((min(100vw,2400px) - var(--gut) - var(--gut-r) - 28px) / 3)}}
.tile-link{display:block;border-radius:var(--tile-r);text-decoration:none;overflow:hidden;position:relative}
.tile .ph{aspect-ratio:16/9}
.tile .ph img{object-position:var(--fp,50% 50%)}
.tile-link::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,11,15,.92) 0%,rgba(11,11,15,.45) 34%,rgba(11,11,15,0) 60%);pointer-events:none}
.tile .logo{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;font-size:clamp(28px,8vw,36px);transition:transform .3s var(--ease)}
@media (min-width:700px){.tile .logo{font-size:clamp(30px,2.7vw,46px);left:20px;bottom:18px}}
.tile .logo-pf{font-size:clamp(32px,9vw,40px)}
@media (min-width:700px){.tile .logo-pf{font-size:clamp(34px,3.1vw,52px)}}
.tile-more{display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 0}
.tile-genre{margin:0;color:var(--fg-2);font-size:14px;font-weight:500}
.tile-play{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center;cursor:pointer;text-decoration:none;transition:box-shadow .2s,transform .08s}
.tile-play svg{width:18px;height:18px;margin-left:2px}
.tile-play:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 35%,transparent),0 0 22px color-mix(in srgb,var(--ac) 50%,transparent)}
.tile-play:active{transform:scale(.94)}
.tile-play:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac)}
@media (hover:hover) and (pointer:fine){
  .tile-more{display:flex;position:absolute;left:0;right:0;top:100%;padding:12px 16px 14px;background:var(--bg-2);border-radius:0 0 var(--tile-r) var(--tile-r);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
  .tile:hover,.tile:focus-within{transform:scale(1.045);z-index:5;box-shadow:0 18px 40px rgba(0,0,0,.6)}
  .tile:hover .tile-link,.tile:focus-within .tile-link{border-radius:var(--tile-r) var(--tile-r) 0 0}
  .tile:hover .tile-more,.tile:focus-within .tile-more{opacity:1;transform:none;pointer-events:auto;box-shadow:0 18px 40px rgba(0,0,0,.6)}
  .games-row .track{padding-bottom:96px;margin-bottom:-96px}
}
.tile-link:focus-visible{outline:none}
.tile:has(.tile-link:focus-visible){box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac),0 0 30px color-mix(in srgb,var(--ac) 50%,transparent)}
.tile-link:active{opacity:.92}

/* moment tile */
.moment{display:block;width:min(64vw,300px);padding:0;border:0;background:none;cursor:pointer;border-radius:6px;overflow:hidden;transition:transform .25s var(--ease)}
@media (min-width:700px){.moment{width:calc((100vw - var(--gut) - var(--gut-r) - 42px) / 3.4)}}
@media (min-width:1080px){.moment{width:calc((min(100vw,2400px) - var(--gut) - var(--gut-r) - 56px) / 4.6)}}
.moment .ph{aspect-ratio:16/9}
.moment:hover{transform:scale(1.04)}
.moment:active{transform:scale(1)}
.moment:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac),0 0 22px color-mix(in srgb,var(--ac) 50%,transparent)}
.moment-cap{display:block;width:0;min-width:100%;margin-top:8px;color:var(--fg-3);font-size:13px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moment-cap b{color:var(--fg-2);font-weight:600}

.empty{margin:0 var(--gut-r) 0 var(--gut);padding:40px 0;color:var(--fg-2)}

/* skeletons */
.ph{position:relative;background:var(--bg-3);overflow:hidden}
.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.4s linear infinite}
.ph.loaded::before{display:none}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.ph.loaded img{opacity:1}
.ph.failed::after{content:"Image unavailable";position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-3);font-size:13px}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}

/* footer */
.foot{margin-top:56px;padding:24px var(--gut-r) calc(28px + env(safe-area-inset-bottom)) var(--gut);color:var(--fg-3);font-size:13px}
@media (min-width:700px){.foot{margin-top:80px}}
.foot p{margin:0}

/* ---------- dialogs ---------- */
dialog{padding:0;border:0;max-width:none;max-height:none;margin:0;width:100%;height:100%;color:var(--fg);background:var(--bg)}
dialog::backdrop{background:rgba(0,0,0,.7)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:rgba(20,20,25,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .08s}
.icon-btn:hover{background:rgba(60,60,70,.85)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac,#fff)}

/* detail */
#detail{overflow-y:auto;overscroll-behavior:contain}
#detail[open]{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.d-bar{position:sticky;top:0;z-index:10;height:0;overflow:visible}
.d-bar::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(72px + env(safe-area-inset-top));background:rgba(11,11,15,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);opacity:0;transition:opacity .2s}
.d-bar-title{position:absolute;left:var(--gut);right:calc(var(--gut-r) + 60px);top:calc(env(safe-area-inset-top) + 24px);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.d-bar.scrolled::before,.d-bar.scrolled .d-bar-title{opacity:1}
.d-bar .icon-btn{position:absolute;right:var(--gut-r);top:calc(env(safe-area-inset-top) + 12px);width:48px;height:48px}
.d-hero{position:relative;height:min(120vw,64svh);min-height:340px}
@media (min-width:700px){.d-hero{height:min(48vw,72svh);min-height:420px}}
.d-hero .ph{position:absolute;inset:0}
.d-hero .mute{bottom:4px}
@media (min-width:700px){.d-hero .mute{bottom:32px}}
.d-hero .ph img{object-position:var(--fp,50% 50%)}
.d-hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,var(--bg) 0%,rgba(11,11,15,.7) 22%,rgba(11,11,15,0) 55%),linear-gradient(180deg,rgba(11,11,15,.5),rgba(11,11,15,0) 22%)}
@media (min-width:700px){.d-hero::after{background:linear-gradient(0deg,var(--bg) 0%,rgba(11,11,15,.5) 24%,rgba(11,11,15,0) 50%),linear-gradient(90deg,rgba(11,11,15,.8),rgba(11,11,15,0) 50%),linear-gradient(180deg,rgba(11,11,15,.5),rgba(11,11,15,0) 22%)}}
.d-head{position:absolute;z-index:2;left:var(--gut);right:calc(var(--gut-r) + 56px);bottom:0;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.d-head{bottom:28px;max-width:720px}}
.d-head .logo{font-size:clamp(44px,12vw,60px)}
@media (min-width:700px){.d-head .logo{font-size:clamp(56px,6vw,96px)}}
.d-head .logo-pf{font-size:clamp(52px,14vw,70px)}

.viewer-main:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac)}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.viewer-nav.l{left:10px}.viewer-nav.r{right:10px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;list-style:none;padding:4px 2px;margin-left:-2px;margin-right:-2px}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:0 0 auto;width:112px;padding:0;border:0;background:none;border-radius:5px;overflow:hidden;cursor:pointer;opacity:.5;transition:opacity .2s;position:relative}

.thumb .ph{aspect-ratio:16/9}
.thumb:hover{opacity:.85}
.thumb[aria-current="true"]{opacity:1;box-shadow:inset 0 0 0 2px var(--ac)}
.thumb[aria-current="true"]::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--ac);border-radius:5px}
.thumb:focus-visible{outline:none;opacity:1;box-shadow:0 0 0 2px var(--ac)}
.viewer-cap{margin:10px 0 0;color:var(--fg-3);font-size:13.5px}

.plats{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--fg-2);font-size:14px;list-style:none;margin:0;padding:0}
.plats li{display:inline-flex;align-items:center;gap:8px}
.plats svg{width:20px;height:20px;color:var(--fg)}
table.controls{width:100%;border-collapse:collapse;font-size:14px}
.controls th,.controls td{text-align:left;padding:9px 10px 9px 0;vertical-align:top;border-bottom:1px solid var(--line);color:var(--fg-2);font-weight:400}

/* lightbox */

  if (main) {
    let sx = null, sy = 0;
    main.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") { sx = e.clientX; sy = e.clientY; } });
    main.addEventListener("pointerup", e => { if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); main._swiped = true; setView(v + (dx < 0 ? 1 : -1)); } });
    main.addEventListener("click", e => { if (main._swiped) { main._swiped = false; e.stopImmediatePropagation(); } }, true);
  }
}
function openDetail(id, opener, push) {
  const g = GAMES.find(x => x.id === id);
  if (!g) return false;
  current = g; renderDetail(g);
  document.title = `${g.title} | Diego's Games`;
  if (push && location.hash !== "#" + id) history.pushState({ d: id }, "", "#" + id);
  openModal(detail, opener);
  detail.scrollTop = 0;
  detail.querySelector(".btn-play").focus({ preventScroll: true });
  return true;
}
function closeDetail(fromPop) {
  if (!detail.open) return;
  closeModal(detail);
  DetailVid.release();
  document.title = "Diego's Games";
  if (!fromPop && location.hash) {
    if (history.state && history.state.d) history.back();
    else history.replaceState(null, "", location.pathname + location.search);
  }
}
detail.addEventListener("request-close", () => closeDetail(false));
detail.addEventListener("click", e => { if (e.target.closest("[data-play-here]")) Player.open(current, e.target.closest("[data-play-here]")); });
document.addEventListener("click", e => {
  const a = e.target.closest("[data-open]");
  if (!a || detail.contains(a) || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); openDetail(a.dataset.open, a, true);
});
function syncHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && GAMES.some(g => g.id === id)) { if (!detail.open || current.id !== id) openDetail(id, null, false); }
  else if (detail.open) closeDetail(true);
}
addEventListener("popstate", syncHash);
addEventListener("hashchange", syncHash);
syncHash();

/* ---------- lightbox ---------- */
const Lightbox = (() => {
  const dlg = $("#lightbox"), img = $("#lbImg"), vid = $("#lbVid"), count = $("#lbCount"), stage = $("#lbStage");
  vid.dataset.sound = 1;
  let list = [], i = 0;
  const show = () => {
    const [src, cap, meta] = list[i];
    count.textContent = `${i + 1} / ${list.length}   ${cap}`;
    if (meta && meta.video) {
      img.hidden = true; vid.hidden = false;
      vid.poster = meta.poster; vid.dataset.src = src; vid.setAttribute("aria-label", cap);
      Media.play(vid);
    } else {
      if (vid.getAttribute("src")) Media.stop(vid, true);
      vid.hidden = true; img.hidden = false;
      img.src = src; img.alt = cap;
    }
  };
  const step = d => { i = (i + d + list.length) % list.length; show(); };
  $("#lbPrev").addEventListener("click", () => step(-1));
  $("#lbNext").addEventListener("click", () => step(1));
  dlg.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  });
  let sx = null, sy = 0;
  stage.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
  stage.addEventListener("pointerup", e => {
    if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    else if (e.target === stage) dlg.dispatchEvent(new Event("request-close"));
  });
  dlg.addEventListener("request-close", () => { Media.stop(vid, true); vid.hidden = true; img.hidden = false; closeModal(dlg); });
  return {
    open(l, n, opener, theme) { list = l; i = n; dlg.className = theme || ""; openModal(dlg, opener); show(); dlg.querySelector("[data-close]").focus(); },
    step
  };
})();

/* ---------- in-page player ---------- */
const Player = (() => {
  const dlg = $("#player"), frame = $("#plFrame"), loading = $("#plLoading");
  $("#plSentinel").addEventListener("focus", () => $("#plNewTab").focus());
  $("#plRotateGo").addEventListener("click", () => { dlg.classList.add("dismissed"); frame.focus(); });
  frame.addEventListener("load", () => { if (frame.src && frame.src !== "about:blank") loading.hidden = true; });
  dlg.addEventListener("request-close", () => { closeModal(dlg); frame.src = "about:blank"; });
  return {
    open(g, opener) {
      dlg.className = g.theme + (g.landscape ? " wants-landscape" : "");
      $("#plTitle").textContent = g.title;
      $("#plNewTab").href = g.play;
      $("#plRotateText").textContent = `Turn your phone sideways. ${g.title} plays best in landscape.`;
      frame.title = `${g.title}, playable game`;
      loading.hidden = false; frame.src = g.play;
      openModal(dlg, opener);
      dlg.querySelector("[data-close]").focus();
    }
  };
})();
</script>
</body>
